# Local development config. Every key can be overridden with an APP_-prefixed
# env var, e.g. APP_SERVER_PORT=9090, APP_POSTGRES_DSN=..., APP_OTEL_ENABLED=false.
app:
  name: go-boilerplate
  env: development

server:
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
  # Per-request context deadline; must stay below write_timeout.
  request_timeout: 20s
  # pprof on a private localhost-only listener; 0 disables. Never public.
  pprof_port: 6060

postgres:
  dsn: postgres://app:app@localhost:5433/app?sslmode=disable
  max_conns: 25
  min_conns: 2
  max_conn_lifetime: 1h
  # Apply embedded goose migrations at boot. Off in prod; run goose from CI.
  migrate: true

redis:
  # disabled = no redis, no caching
  # optional = degrade gracefully: warn and run uncached when unreachable
  # required = fail-fast at startup when unreachable
  mode: optional
  addr: localhost:6380
  password: ""
  db: 0

cache:
  default_ttl: 5m

otel:
  enabled: true
  endpoint: localhost:4317
  insecure: true
  sample_ratio: 1.0

log:
  level: debug
  format: text

ratelimit:
  enabled: true
  rps: 20 # sustained requests/second per client IP
  burst: 40 # max requests allowed in a single 1s window
