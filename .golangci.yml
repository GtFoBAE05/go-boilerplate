version: "2"

run:
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - depguard
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        # Services are named resource-qualified (UserService, NewUserService)
        # so a grep for the name lands on one thing and composition-layer call
        # sites read without leaning on the import alias. Under
        # package-per-resource that reads as user.UserService, which the
        # stutter check rejects — the naming convention wins here.
        - name: exported
          arguments:
            - disableStutteringCheck
    depguard:
      rules:
        # internal/platform holds generic infrastructure adapters. They take
        # plain values plus functional options and know nothing about this
        # application, which is what keeps them constructible from a test or a
        # one-off tool with no config.Config. Grouping them under one directory
        # is only safe while that rule is enforced — otherwise "platform"
        # becomes the dumping ground every such directory turns into.
        platform-stays-generic:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/GtFoBAE05/go-boilerplate/internal
              desc: >-
                internal/platform must not import application packages. If an
                adapter needs app knowledge, the decision belongs in app/ and
                should be passed in as a plain value.
        # Only the composition root reads configuration; everything downstream
        # receives the decisions already made.
        config-is-for-composition:
          files:
            - "**/internal/handler/**"
            - "**/internal/service/**"
            - "**/internal/repository/**"
          deny:
            - pkg: github.com/GtFoBAE05/go-boilerplate/internal/config
              desc: >-
                only app/ and server/ may import config; take plain values or a
                narrow interface instead.
        # A handler that imports sqlc/pgx has bypassed the layer that owns
        # business rules and transactions. The architecture test catches this
        # too, but lint points at the line the author just wrote.
        handler-stays-http-only:
          files:
            - "**/internal/handler/**"
          deny:
            - pkg: github.com/GtFoBAE05/go-boilerplate/internal/repository
              desc: >-
                handlers call services, never the repository. Put the query in
                the service that owns the use case.
  exclusions:
    generated: lax
    paths:
      - internal/repository # sqlc-generated

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      # Stated explicitly rather than inferred: this is the grouping the
      # README and AGENTS.md document, and a future module rename must not
      # silently change how imports are sorted.
      module-path: github.com/GtFoBAE05/go-boilerplate
    goimports:
      local-prefixes:
        - github.com/GtFoBAE05/go-boilerplate
