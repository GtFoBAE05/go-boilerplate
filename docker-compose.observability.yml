# Local observability stack, kept separate from application dependencies so it
# can be started only when needed. Start it alone with:
#
#   docker compose -f docker-compose.observability.yml up -d
#
# or together with Postgres and Redis with:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (app → collector)
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape target (collector → prometheus)
    depends_on:
      - jaeger

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    command: ["--config", "/etc/jaeger.yaml"]
    volumes:
      - ./deploy/jaeger.yaml:/etc/jaeger.yaml:ro
    ports:
      - "16686:16686" # UI: http://localhost:16686
      # 4317 not exposed to host — collector talks to jaeger internally

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    ports:
      - "9090:9090" # UI: http://localhost:9090
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on:
      - otel-collector
