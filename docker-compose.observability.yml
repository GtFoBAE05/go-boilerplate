# Local LGTM stack, kept separate from application dependencies so it can be
# started only when needed. Start it alone with:
#
#   mkdir -p .tmp/logs
#   docker compose -f docker-compose.observability.yml up -d
#
# or together with Postgres and Redis with:
#
#   make docker-up-all
#
# `make observability-up` and `make docker-up-all` create .tmp/logs for you;
# invoking Compose directly needs the mkdir because the bind mount is read-only.
#
# This is development configuration: filesystem storage, no replication, no
# auth, and no TLS. Production needs object storage and tenant isolation.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    command: ["--config=/etc/otel-collector.yaml"]
    # The upstream image runs as a non-root user; the named volume is created
    # root-owned, so the filelog offset store cannot be opened otherwise. This
    # is a local-only stack.
    user: "0:0"
    environment:
      # Compose reads this from .env; the collector uses it as the Loki
      # service.name resource attribute. The default keeps the stack usable
      # without a .env file.
      SERVICE_NAME: ${SERVICE_NAME:-go-boilerplate}
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
      - ./.tmp/logs:/var/log/app:ro
      - otelcol-data:/var/lib/otelcol
    ports:
      - "4317:4317" # OTLP gRPC (app → collector)
      - "4318:4318" # OTLP HTTP
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665
    command: ["-config.file=/etc/loki.yaml"]
    volumes:
      - ./deploy/loki.yaml:/etc/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100" # API and Grafana datasource
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.0@sha256:3cbb1b4eae79b158d25006d88abadb1f87ef98f8a902cd54c3bdffff78ea6cda
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # API and Grafana datasource
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mimir:
    image: grafana/mimir:2.17.0@sha256:614146229384e3dd3367d98cbd9ddc195dffe13fdfb88d77520148f09735fa8f
    command: ["-config.file=/etc/mimir.yaml", "-target=all"]
    volumes:
      - ./deploy/mimir.yaml:/etc/mimir.yaml:ro
      - mimir-data:/data
    ports:
      - "9009:9009" # query API at /prometheus, remote write at /api/v1/push
    restart: unless-stopped

  # One-shot rule loader. It waits for wait-for, so a cold start cannot race
  # Mimir's startup. Restart-on-failure still covers a transient rule load error.
  mimir-rules:
    image: grafana/mimirtool:2.17.0@sha256:2b77e04dd666461d47613f7a7f6ab35720744dc673c55cdbaee931b1155f3ff9
    command:
      - rules
      - load
      - --address=http://mimir:9009
      - --id=anonymous
      - /etc/rules.yml
    volumes:
      - ./deploy/rules.yml:/etc/rules.yml:ro
    depends_on:
      wait-for:
        condition: service_completed_successfully
    restart: on-failure

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000" # UI: http://localhost:3000
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Mimir and the collector images are distroless, so they cannot run an
  # in-container wget/curl probe. This one-shot service is the readiness gate:
  # it checks every HTTP endpoint and only exits 0 once all are ready.
  wait-for:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command:
      - sh
      - -c
      - |
        set -eu
        deadline=$$(($$(date +%s) + 120))
        for target in \
          "loki http://loki:3100/ready" \
          "tempo http://tempo:3200/ready" \
          "mimir http://mimir:9009/ready" \
          "grafana http://grafana:3000/api/health" \
          "otel-collector http://otel-collector:13133/"; do
          name=$${target%% *}
          url=$${target#* }
          until wget -q -O /dev/null "$$url"; do
            if [ "$$(date +%s)" -ge "$$deadline" ]; then
              echo "$$name is not ready: $$url" >&2
              exit 1
            fi
            sleep 2
          done
          echo "$$name is ready"
        done
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      mimir:
        condition: service_started
      grafana:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: "no"

volumes:
  otelcol-data:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
