services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host port 5433 to avoid colliding with a natively installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres starts empty; the app applies goose migrations at boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Host port 6380 to avoid colliding with a natively installed Redis.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (app → collector)
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus scrape target (collector → prometheus)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI: http://localhost:16686
      # 4317 not exposed to host — collector talks to jaeger internally

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090" # UI: http://localhost:9090
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on:
      - otel-collector

volumes:
  pgdata:
