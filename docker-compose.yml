# Local application dependencies. The observability stack lives in
# docker-compose.observability.yml so it can be started only when needed.
# Full stack: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host port 5433 to avoid colliding with a natively installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres starts empty; the app applies goose migrations at boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193
    ports:
      # Host port 6380 to avoid colliding with a natively installed Redis.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
