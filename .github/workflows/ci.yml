name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep these in sync with the versions pinned in the Makefile.
  SQLC_VERSION: "1.30.0"
  VULN_VERSION: "v1.1.4"
  GOLANGCI_VERSION: "v2.15.0"
  GOSEC_VERSION: "v2.30.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          # Pinned to the version developers run locally, so CI and local
          # results never drift. Bump both together.
          version: ${{ env.GOLANGCI_VERSION }}
          # The published release binary is built with an older Go than go.mod
          # targets, and golangci-lint refuses to run in that case (exit 3).
          # Building from source with the CI toolchain is what `make lint`
          # already does locally, so this is the only mode where the pin means
          # the same thing in both places.
          install-mode: goinstall

  # gosec is not a golangci-lint linter: it needs type information from the
  # whole module and is updated independently. Keep its pin in sync with the
  # Makefile's GOSEC_VERSION.
  gosec:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }} -quiet ./...

  # Proves the documented invariant that `go test ./...` needs no Docker: this
  # job has no services and must stay that way.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go build ./...
      - run: go test -race ./...
      # A tidy tree catches an accidental dependency change that go.sum alone
      # would not reveal.
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum

  # Supersets the unit run: the integration tag adds testcontainers-backed
  # tests on top of everything above.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race -tags integration ./... 2>&1 | tee /tmp/integration.log
      # Public Actions logs need authentication here, so a failed run page
      # shows only "process completed with exit code 1". Surface the tail as
      # an annotation; this is permanent, not a temporary debugging aid.
      - if: failure()
        run: |
          msg=$(tail -c 3500 /tmp/integration.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=integration log::$msg"

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # Pinned, not @latest: an unpinned scanner turns an unrelated upstream
      # release into a red build on a branch that changed nothing.
      - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.VULN_VERSION }} ./... 2>&1 | tee /tmp/vuln.log
      # Public Actions logs need authentication here, so a failed run page
      # shows only "process completed with exit code 1". Surface the tail as
      # an annotation; this is permanent, not a temporary debugging aid.
      - if: failure()
        run: |
          msg=$(tail -c 3500 /tmp/vuln.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=vuln log::$msg"

  sqlc-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - run: sqlc diff || (echo "sqlc-generated code is stale; run 'make sqlc'" && exit 1)

  # Alert rules that query a series which does not exist never fire and never
  # tell you. promtool is the only check that catches a typo in an expression
  # before an incident does.
  promtool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Mimir rule file
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/deploy:/deploy:ro" \
            prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            check rules /deploy/rules.yml

  # Kustomize catches a broken manifest reference or patch before an operator
  # finds out during a rollout. Schema validation belongs to the cluster's
  # admission policy; this job checks that the base and migration overlay build.
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: kubectl kustomize deploy/k8s >/dev/null
      - run: kubectl kustomize deploy/k8s/migrate >/dev/null

  # .env.example and internal/config drift apart silently otherwise: nothing
  # else in CI loads it, and a developer copying it to .env finds out first.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -run 'TestShippedExampleEnvIsValid|TestExampleEnvHasNoUnknownKeys' ./internal/config/...

  # Builds the real production image so a broken Dockerfile fails here rather
  # than at release time. Plain `docker build` on purpose: BuildKit is already
  # the default on GitHub runners, so this needs no third-party action to keep
  # pinned and working.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.observability.yml config >/dev/null
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config >/dev/null
      - run: |
          docker build \
            --build-arg VERSION="${{ github.ref_name }}" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t go-boilerplate:ci .
          docker build --target migrate -t go-boilerplate-migrate:ci .
      # Proves the entrypoint is runnable and that config validation passes on
      # a development config — a bad COPY or a stray dependency on the build
      # stage would otherwise only surface on first deploy.
      - name: Smoke test the image
        run: |
          output=$(docker run --rm \
            -e SERVICE_ENV=development \
            -e POSTGRES_DSN="postgres://app:app@127.0.0.1:59999/app?sslmode=disable" \
            -e OTEL_SDK_DISABLED=true \
            -e REDIS_MODE=disabled \
            -e RATELIMIT_ENABLED=false \
            go-boilerplate:ci 2>&1 || true)
          echo "$output"
          # Reaching the Postgres dial means config loaded and the app booted.
          echo "$output" | grep -q "connect postgres" \
            || (echo "::error::image did not reach the postgres connect step" && exit 1)

          migrate_output=$(docker run --rm \
            -e SERVICE_ENV=development \
            -e POSTGRES_DSN="postgres://app:app@127.0.0.1:59999/app?sslmode=disable" \
            go-boilerplate-migrate:ci 2>&1 || true)
          echo "$migrate_output"
          echo "$migrate_output" | grep -q "connect postgres" \
            || (echo "::error::migration image did not reach the postgres connect step" && exit 1)
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: go-boilerplate:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan migration image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: go-boilerplate-migrate:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan repository for secrets and misconfiguration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          exit-code: "1"
          severity: CRITICAL,HIGH
