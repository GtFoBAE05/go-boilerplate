apiVersion: v1
kind: ConfigMap
metadata:
  name: go-boilerplate
  namespace: go-boilerplate
  labels:
    app.kubernetes.io/name: go-boilerplate
data:
  SERVICE_NAME: go-boilerplate
  SERVICE_ENV: production
  SERVER_PORT: "8080"
  SERVER_REQUEST_TIMEOUT: 20s
  SERVER_DRAIN_DELAY: 5s
  # Set this to the ingress/load-balancer CIDRs. Empty means X-Forwarded-For is
  # ignored and every client shares the proxy's rate-limit bucket.
  SERVER_TRUSTED_PROXY_CIDRS: ""
  POSTGRES_MAX_CONNS: "25"
  POSTGRES_MIN_CONNS: "2"
  POSTGRES_MAX_CONN_LIFETIME: 1h
  POSTGRES_MAX_CONN_LIFETIME_JITTER: 5m
  POSTGRES_STATEMENT_TIMEOUT: 10s
  POSTGRES_LOCK_TIMEOUT: 5s
  POSTGRES_IDLE_IN_TRANSACTION_TIMEOUT: 30s
  POSTGRES_QUERY_EXEC_MODE: cache_statement
  POSTGRES_MIGRATE: "false"
  REDIS_MODE: required
  REDIS_ADDR: redis:6379
  RATELIMIT_ENABLED: "true"
  RATELIMIT_REQUESTS: "40"
  RATELIMIT_WINDOW: 1s
  OTEL_SDK_DISABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  LOG_LEVEL: info
  LOG_FORMAT: json
  PPROF_ENABLED: "false"
