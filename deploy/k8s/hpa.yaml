apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-boilerplate
  labels:
    app.kubernetes.io/name: go-boilerplate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-boilerplate
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
