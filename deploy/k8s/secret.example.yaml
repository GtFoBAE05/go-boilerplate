# Do not commit real values. Create these with your secret manager or:
#   kubectl -n go-boilerplate create secret generic go-boilerplate-runtime \
#     --from-literal=POSTGRES_DSN='postgres://app:...@postgres:5432/app?sslmode=verify-full'
#   kubectl -n go-boilerplate create secret generic go-boilerplate-migrate \
#     --from-literal=POSTGRES_MIGRATION_DSN='postgres://migrator:...@postgres:5432/app?sslmode=verify-full'
apiVersion: v1
kind: Secret
metadata:
  name: go-boilerplate-runtime
  namespace: go-boilerplate
  labels:
    app.kubernetes.io/name: go-boilerplate
type: Opaque
stringData:
  POSTGRES_DSN: "postgres://app:CHANGE_ME@postgres:5432/app?sslmode=verify-full"
  REDIS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: go-boilerplate-migrate
  namespace: go-boilerplate
  labels:
    app.kubernetes.io/name: go-boilerplate
type: Opaque
stringData:
  POSTGRES_MIGRATION_DSN: "postgres://migrator:CHANGE_ME@postgres:5432/app?sslmode=verify-full"
