# This is a starting point, not a universal policy. Narrow the RFC1918 egress
# ranges to your data plane, and change the ingress namespace to your controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-boilerplate
  labels:
    app.kubernetes.io/name: go-boilerplate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-boilerplate
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 4317
