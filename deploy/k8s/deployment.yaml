apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-boilerplate
  labels:
    app.kubernetes.io/name: go-boilerplate
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-boilerplate
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-boilerplate
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: go-boilerplate
      automountServiceAccountToken: false
      # 5s drain delay + 20s shutdown + margin. Keep this above the app's
      # SERVER_DRAIN_DELAY + SERVER_SHUTDOWN_TIMEOUT.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-boilerplate
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: registry.example.com/go-boilerplate:VERSION
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: go-boilerplate
            - secretRef:
                name: go-boilerplate-runtime
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
