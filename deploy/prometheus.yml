global:
  scrape_interval: 15s
  # Rules evaluate on their own clock; keeping it at the scrape interval means a
  # recording rule never averages the same sample twice.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # The app does not serve /metrics — it pushes OTLP to the collector, which
  # re-exposes everything for scraping. So this target is the collector, and one
  # scrape carries every replica's series.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
    # Without this, Prometheus overwrites the job and instance labels the
    # collector derived from each app's service.name / service.instance.id, and
    # every replica's metrics would be attributed to the collector itself.
    honor_labels: true
